name: Sync server release

# Push a tag like v1.0.0 to publish binaries to GitHub Releases and the
# multi-arch image to ghcr.io/henriquefps/markdown-preview-sync.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: sync-server/go.mod
          cache-dependency-path: sync-server/go.mod

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
          workdir: sync-server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
