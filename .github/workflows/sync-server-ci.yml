name: Sync server CI

on:
  pull_request:
    paths:
      - "sync-server/**"
      - ".github/workflows/sync-server-*.yml"
  push:
    branches: [main]
    paths:
      - "sync-server/**"
      - ".github/workflows/sync-server-*.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: sync-server/go.mod
          cache-dependency-path: sync-server/go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
          workdir: sync-server
